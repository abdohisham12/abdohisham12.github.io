<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768">
  <!-- Dark Background -->
  <rect width="1024" height="768" fill="#050505"/>

  <!-- Subtle background grid for technical/SaaS feel -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none"/>
    </pattern>
    <rect width="1024" height="768" fill="url(#grid)"/>
  </g>

  <!-- Glowing center element -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff"/>
    </marker>
  </defs>
  <circle cx="512" cy="384" r="500" fill="url(#glow)"/>

  <!-- AydnLabs Logo -->
  <image href="logo no background_3.png" x="60" y="50" width="280" height="100" preserveAspectRatio="xMinYMin meet"/>

  <!-- Main Title -->
  <text x="60" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="900" fill="#ffffff" letter-spacing="2">AYDNFLOW</text>
  
  <!-- Subtitle -->
  <text x="65" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="600" fill="#bbbbbb">The Ultimate Unified AI CX Hub</text>

  <!-- Hybrid Orchestration Section -->
  <g transform="translate(60, 420)">
    <!-- Generative Box -->
    <rect x="0" y="0" width="380" height="140" rx="12" fill="#111111" stroke="#444444" stroke-width="2"/>
    <text x="30" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Generative AI Mode</text>
    <text x="30" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#999999">Natural Conversation</text>
    <text x="30" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#777777">Sales Objections &amp; SDR Tasks</text>

    <!-- Arrows (Hybrid Orchestration) -->
    <text x="440" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">HYBRID</text>
    <text x="440" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#999999" text-anchor="middle">ORCHESTRATION</text>
    <path d="M 390 100 L 490 100" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Deterministic Box -->
    <rect x="500" y="0" width="380" height="140" rx="12" fill="#111111" stroke="#444444" stroke-width="2"/>
    <text x="530" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Deterministic Template Mode</text>
    <text x="530" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#999999">Structured Workflows</text>
    <text x="530" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#777777">Data Compliance &amp; Audit Trails</text>
  </g>

  <!-- Bottom Banner -->
  <rect x="0" y="628" width="1024" height="140" fill="#ffffff"/>
  <text x="60" y="685" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#000000">SAFE AI AGENTS FOR MENA SMBs.</text>
  <text x="60" y="725" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#333333">BOOST SALES &amp; SUPPORT, ENSURE COMPLIANCE.</text>
</svg>
